# Rotates the BOS log. Install to /usr/local/etc/newsyslog.conf.d/sc-bos.conf.
# Sends SIGHUP to daemon(8) through its pidfile, and daemon reopens the log file. BOS doesn't get the signal.
# logfilename          [owner:group]    mode count size when  flags [/pid_file]                 [sig_num]
/var/log/sc-bos.log    sc-bos:sc-bos    640  7     10240 *    JC    /var/run/sc_bos/sc_bos.pid  1
