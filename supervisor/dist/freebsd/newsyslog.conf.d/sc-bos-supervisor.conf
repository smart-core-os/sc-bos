# Rotates the Supervisor log. Install to /usr/local/etc/newsyslog.conf.d/sc-bos-supervisor.conf.
# Sends SIGHUP to daemon(8) through its pidfile, and daemon reopens the log file. The Supervisor doesn't get
# the signal.
# logfilename                     [owner:group]  mode count size when  flags [/pid_file]                     [sig_num]
/var/log/sc-bos-supervisor.log    root:wheel     640  7     10240 *    JC    /var/run/sc_bos_supervisor.pid  1
