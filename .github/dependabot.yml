# Dependabot version updates. Security updates are a repo setting, not a key in
# this file, and run regardless of it.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every entry carries a 7-day `cooldown`: a quarantine for a freshly published
# (and possibly compromised) release. It governs *version* updates only.
# GitHub exempts security updates from it, so it never holds back a fix.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # The OpenTelemetry core modules release together at one version, and
      # otel/sdk at 1.N requires otel, otel/metric and otel/trace at 1.N, so
      # `go get` of any one lifts the rest by MVS. Separate PRs would each carry
      # the same family-wide go.mod diff and conflict with one another as soon as
      # the first merged. Group every update type: the exact cross-requirement
      # holds whatever the semver step.
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      # golang.org/x/* are all v0, cut on the same cadence and requiring each
      # other's latest (x/net pulls x/sys and x/text forward), so they arrive as
      # one weekly change. In v0 a minor is the routine step.
      golang-x:
        patterns: ["golang.org/x/*"]
        update-types: ["minor", "patch"]
      # grpc pins a minimum protobuf and genproto/googleapis/rpc, and the
      # generated code in pkg/proto is built against both. Moving them together
      # keeps the runtime and the generated stubs on a set grpc was tested with.
      # A major here means regenerating protos, so it arrives on its own.
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc"
          - "google.golang.org/protobuf"
          - "google.golang.org/genproto/*"
        update-types: ["minor", "patch"]

  # yarn 1 workspace root: one entry covers ops, panzoom-package, space,
  # signage and ui-gen.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The @smart-core-os packages here are this repo's own workspaces
      # (ui-gen, panzoom-package), versioned in-tree. There is nothing upstream
      # to update to, and a lookup on GitHub Packages needs a registry token
      # Dependabot is not given.
      - dependency-name: "@smart-core-os/*"
    groups:
      # The vite plugins peer-depend on vite's major, and yarn 1 only warns on
      # an unmet peer, so a lone vite bump installs and lints green on a set the
      # plugins do not support. Group every update type so the family moves as
      # one. vitest belongs here too: yarn 1 cannot link vitest 4's OR-ranged
      # vite dependency, and the fix is a `resolutions` pin on vite in
      # ui/package.json, which silently holds any vite bump in this group until
      # the pin moves with it.
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # Lint, build and type tooling. Minor/patch arrive as one weekly PR to
      # keep the noise down; majors arrive individually.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Nothing in PR CI builds this Dockerfile: docker-package.yml and
  # build-sc-bos.yml run on `v*` tags only, so a docker PR merges green without
  # the image ever being built. Build it locally (`docker build .`) before
  # merging one.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The Node major is owned by the UI toolchain, with `node-version` in
      # ui-lint.yml and build-sc-bos.yml. Dependabot only sees the
      # `FROM node:<major>` tag and would march it ahead of what CI runs. The
      # major moves by hand, with those workflows.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      # node, golang and alpine are three stages of one image, so their bumps
      # are one change, one PR. A golang bump should also move `go` in go.mod
      # and `go-version` in the workflows: Dependabot only edits the tag.
      docker:
        patterns: ["*"]

  # Without this, action majors drift until GitHub retires the Node runtime
  # they declare. Minor/patch group into one PR; majors arrive individually
  # because PR CI never runs the tag-triggered workflows (build-sc-bos.yml,
  # docker-package.yml), so a grouped major touching them would go green with
  # the affected workflow never exercised.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
