syntax = "proto3";

package smartcore.bos.accesscredential.v1;

option go_package = "github.com/smart-core-os/sc-bos/pkg/proto/accesscredentialpb";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "smartcore/bos/types/v1/info.proto";

// AccessCredentialApi manages the credentials held by a single access control cardholder.
// A credential is something a person presents to a reader to gain access: a card, fob, phone, vehicle plate and so on.
// The device name identifies the cardholder, each credential belongs to exactly one cardholder.
//
// Credential values, like card numbers, can be used to clone a credential.
// Servers should not log credential values and should restrict access to this API.
service AccessCredentialApi {
  // Get a single credential by id.
  rpc GetCredential(GetCredentialRequest) returns (Credential);
  // List the credentials held by the cardholder.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  // Issue a new credential to the cardholder.
  // The server assigns the credential id.
  rpc CreateCredential(CreateCredentialRequest) returns (Credential);
  // Update an existing credential, identified by credential.id.
  rpc UpdateCredential(UpdateCredentialRequest) returns (Credential);
  // Remove a credential from the cardholder.
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
}

// AccessCredentialInfo describes what kinds of credential a cardholder can hold and which properties can be written.
service AccessCredentialInfo {
  rpc DescribeCredential(DescribeCredentialRequest) returns (CredentialSupport);
}

// Credential is something presented to an access control reader to identify a cardholder.
message Credential {
  // Kind is the generic category of a credential, independent of the underlying access control system.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A card presented to a reader, e.g. a proximity or smart card.
    CARD = 1;
    // A key fob or tag.
    FOB = 2;
    // A credential stored on a mobile device.
    MOBILE = 3;
    // A vehicle number plate read by an ANPR camera.
    VEHICLE_PLATE = 4;
    // A telephone number, typically matched against caller id.
    PHONE_NUMBER = 5;
    // A biometric template, e.g. a fingerprint.
    BIOMETRIC = 6;
    // A code entered on a keypad.
    PIN = 7;
  }

  // State is the generic status of a credential.
  // Only ACTIVE credentials grant access.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The credential is usable.
    ACTIVE = 1;
    // The credential has been disabled for a reason not covered by the other states.
    DISABLED = 2;
    // The credential has been reported lost.
    LOST = 3;
    // The credential has been reported stolen.
    STOLEN = 4;
    // The credential is past its expire_time or has otherwise expired.
    EXPIRED = 5;
    // The credential has been issued but is not yet usable, e.g. a mobile credential awaiting acceptance of an invitation.
    PENDING = 6;
  }

  // Invitation records how a mobile credential is delivered to its holder.
  message Invitation {
    // The email address the invitation was, or will be, sent to.
    string email = 1;
    // The phone number the invitation was, or will be, sent to.
    string phone_number = 2;
    // The status of the invitation as reported by the access control system, e.g. "sent" or "accepted".
    // Output only.
    string status = 3;
  }

  // The id of the credential, unique within the cardholder.
  // Output only, assigned by the server when the credential is created.
  // The value is opaque, clients should not attempt to parse it.
  string id = 1;
  // The type of credential, matching a CredentialType.id from DescribeCredential.
  // Required when creating a credential.
  string type = 2;
  // The generic kind of this credential.
  // Output only, derived from type.
  Kind kind = 3;
  // The value that identifies this credential to a reader, e.g. a card number, number plate or phone number.
  // May be empty on create if the type allocates values itself, see CredentialType.value_source.
  string value = 4;
  // The state of the credential.
  // Absent (STATE_UNSPECIFIED) on create means ACTIVE.
  State state = 5;
  // The name of the state in the underlying access control system, e.g. "Damaged".
  // Output only.
  // Useful where the system has more states than State can express.
  string native_state = 6;
  // The time the credential becomes usable.
  // Absent means the credential is usable from creation.
  google.protobuf.Timestamp active_time = 7;
  // The time the credential stops being usable.
  // Absent means the credential does not expire.
  google.protobuf.Timestamp expire_time = 8;
  // The issue level of the credential, incremented each time a card with the same value is reissued.
  // Readers may reject a card whose issue level does not match.
  // Absent if the system does not track issue levels.
  optional int32 issue_level = 9;
  // How the credential is delivered to its holder.
  // Only used for mobile credentials, see CredentialType.invitation_required.
  Invitation invitation = 10;

  // System specific information about the credential.
  map<string, string> more = 100;
}

message GetCredentialRequest {
  // Name of the cardholder device.
  string name = 1;
  // The id of the credential to get.
  string id = 2;
  // Fields to fetch relative to the Credential type.
  google.protobuf.FieldMask read_mask = 3;
}

message ListCredentialsRequest {
  // Name of the cardholder device.
  string name = 1;
  // Fields to fetch relative to the Credential type.
  google.protobuf.FieldMask read_mask = 2;
  // The maximum number of credentials to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 items will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  int32 page_size = 3;
  // A page token, received from a previous `ListCredentialsResponse` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 4;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
  // A token, which can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
  // If non-zero this is the total number of credentials held by the cardholder.
  // This may be an estimate.
  int32 total_size = 3;
}

message CreateCredentialRequest {
  // Name of the cardholder device.
  string name = 1;
  // The credential to create.
  // The id is ignored, type is required.
  Credential credential = 2;
}

message UpdateCredentialRequest {
  // Name of the cardholder device.
  string name = 1;
  // The new credential properties.
  // The id identifies which credential to update and is required.
  Credential credential = 2;
  // Fields to update relative to the Credential type.
  // If absent all writable fields are updated.
  google.protobuf.FieldMask update_mask = 3;
}

message DeleteCredentialRequest {
  // Name of the cardholder device.
  string name = 1;
  // The id of the credential to delete.
  string id = 2;
  // If true, no error will be returned if the credential does not exist.
  bool allow_missing = 3;
}

message DeleteCredentialResponse {}

message DescribeCredentialRequest {
  // Name of the cardholder device.
  string name = 1;
}

// CredentialSupport describes the credentials a cardholder device supports.
message CredentialSupport {
  // How the device supports credential management.
  // Pull is not part of this API, observable will be false.
  // writable_fields lists the Credential fields that can be set on create or update.
  smartcore.bos.types.v1.ResourceSupport resource_support = 1;
  // The types of credential that can be created.
  // Credentials of other types may still be returned by Get and List.
  repeated CredentialType types = 2;
}

// CredentialType describes one type of credential supported by the access control system.
message CredentialType {
  // ValueSource describes who chooses the value of a new credential.
  enum ValueSource {
    VALUE_SOURCE_UNSPECIFIED = 0;
    // The caller must supply the value when creating the credential.
    CALLER_SUPPLIED = 1;
    // The access control system allocates the value, any value supplied by the caller is an error.
    SYSTEM_ALLOCATED = 2;
    // The caller may supply the value, if absent the system allocates one.
    EITHER = 3;
  }

  // NativeState describes a state of the underlying access control system and how it maps to a generic State.
  message NativeState {
    // The id of the state in the access control system.
    string id = 1;
    // A human readable name for the state.
    string display_name = 2;
    // The generic state this native state is reported as.
    Credential.State state = 3;
  }

  // The id of this type, used as Credential.type.
  string id = 1;
  // A human readable name for this type, e.g. "Proximity card".
  string display_name = 2;
  // The generic kind of credentials of this type.
  Credential.Kind kind = 3;
  // Who chooses the value of a new credential of this type.
  ValueSource value_source = 4;
  // The states a credential of this type can be set to on create or update.
  repeated Credential.State writable_states = 5;
  // The native states credentials of this type can have.
  // Absent if the system has no states beyond those in Credential.State.
  repeated NativeState native_states = 6;
  // Whether creating a credential of this type requires Credential.invitation to be set.
  bool invitation_required = 7;
}
